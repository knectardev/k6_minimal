<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knectar Portfolio – Project | Web Development & Design</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="View detailed project information from Knectar's portfolio. Explore our web development and design work across various technologies and industries.">
    <meta name="keywords" content="project, portfolio, web development, design, knectar, case study">
    <meta name="author" content="Knectar">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://knectar.com/project.html">
    <meta property="og:title" content="Knectar Portfolio – Project | Web Development & Design">
    <meta property="og:description" content="View detailed project information from Knectar's portfolio. Explore our web development and design work.">
    <meta property="og:image" content="https://knectar.com/assets/logo.svg">
    <meta property="og:site_name" content="Knectar">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://knectar.com/project.html">
    <meta property="twitter:title" content="Knectar Portfolio – Project | Web Development & Design">
    <meta property="twitter:description" content="View detailed project information from Knectar's portfolio. Explore our web development and design work.">
    <meta property="twitter:image" content="https://knectar.com/assets/logo.svg">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://knectar.com/project.html">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="apple-touch-icon" href="assets/logo.svg">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Scripts -->
    <script src="js/load_menu.js" defer></script>
    <!-- Highlight.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Override highlight.js styles for proper line breaks -->
    <style>
        /* Force line breaks for highlight.js code blocks */
        .description-edit-wrap .description-display pre code.hljs,
        /* Code block line height now controlled via CSS variables */
        .description-edit-wrap .description-display pre code.hljs.language-javascript,
        .description-edit-wrap .description-display pre code.hljs.language-python,
        .description-edit-wrap .description-display pre code.hljs.language-html,
        .description-edit-wrap .description-display pre code.hljs.language-css {
            display: block !important;
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
            font-family: 'Courier New', monospace !important;
            line-height: var(--line-height-code) !important;
        }
        
        .description-edit-wrap .description-display pre {
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
        }
        
        /* Force line breaks for highlight.js span elements */
        .description-edit-wrap .description-display pre code.hljs span {
            white-space: pre-wrap !important;
            display: inline !important;
        }
        
        /* Handle line breaks within highlight.js content */
        .description-edit-wrap .description-display pre code.hljs br {
            display: block !important;
            content: "" !important;
            margin-top: 0.5em !important;
        }
        
        /* Nuclear option - force all text content to preserve whitespace */
        .description-edit-wrap .description-display pre code.hljs * {
            white-space: pre-wrap !important;
        }

        /* Make stack images clickable */
        .detail-stack-image {
            cursor: pointer;
        }

        /* Modal overlay for expanded images */
        .image-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000; /* above GitHub button */
            cursor: zoom-out;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-modal-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .image-modal-overlay.active { opacity: 1; }
        .image-modal-overlay.active img { transform: scale(1); }

        /* Close button */
        .image-modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 28px;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }

        /* Arrow controls */
        .image-modal-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 48px;
            color: #fff;
            cursor: pointer;
            user-select: none;
            padding: 8px 16px;
        }
        .image-modal-arrow.left { left: 16px; }
        .image-modal-arrow.right { right: 16px; }
        .image-modal-arrow.disabled { opacity: 0.3; cursor: default; }
        
        /* Line spacing is now controlled centrally via CSS variables */
        /* See css/style.css for --line-height-description and --line-height-code */
    </style>
</head>
<body>
    <div class="container">
        <main class="main-content">
            <header class="page-header">
                <div class="mobile-header-top">
                    <div class="logo logo-mobile">
                        <a href="index.html"><img src="assets/logo.svg" alt="Knectar Logo" class="logo-icon">KNECTAR</a>
                    </div>
                    <button class="hamburger" id="hamburger-button" aria-label="Toggle navigation menu" aria-expanded="false">
                        <span></span><span></span><span></span>
                    </button>
                </div>
                <!-- Dynamic breadcrumbs -->
                <div class="breadcrumbs">
                    <a href="projects.html" class="breadcrumb-link">Projects</a> &gt; <a href="#" class="breadcrumb-link" id="crumbCategoryLink"></a> &gt; <span data-field="projectTitle"></span>
                </div>
            </header>
            <section class="project-details">
                <div class="project-gallery" aria-label="Project gallery">
                    <!-- Existing image logic -->
                    <img id="project-main-image" src="" alt="Project image" style="display:none;" />
                    <img id="project-detail-image" src="" alt="Project detail image" style="display:none; position:absolute; top:80px; width:340px; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.10);" />
                </div>
                <!-- Removed static .mobile-gallery -->
                <div class="project-info" aria-label="Project information"><!-- populated dynamically --></div>
            </section>
        </main>
    </div>
    <script>
        // Fix line breaks in code blocks after highlight.js processes them
        function fixCodeBlockLineBreaks() {
            const codeBlocks = document.querySelectorAll('.description-edit-wrap .description-display pre code.hljs');
            codeBlocks.forEach(codeBlock => {
                // Find all span elements and add line breaks where needed
                const spans = codeBlock.querySelectorAll('span');
                spans.forEach((span, index) => {
                    // Check if this span contains a line break
                    if (span.textContent.includes('\n')) {
                        // Replace \n with <br> tags
                        span.innerHTML = span.innerHTML.replace(/\n/g, '<br>');
                    }
                });
            });
        }

        // Force line-height on dynamically generated content
        function applyLineHeightToProjectInfo() {
            const projectInfo = document.querySelector('.project-info');
            if (!projectInfo) return;
            
            // Get the CSS variable values
            const computedStyle = getComputedStyle(document.documentElement);
            const descriptionLineHeight = computedStyle.getPropertyValue('--line-height-description');
            const codeLineHeight = computedStyle.getPropertyValue('--line-height-code');
            
            // Apply to all text content (excluding code blocks)
            const textElements = projectInfo.querySelectorAll('p, div, span, h1, h2, h3, h4, h5, h6, li, ul, ol, blockquote, strong, em, b, i, a');
            textElements.forEach(el => {
                // Skip if it's a code element or inside a code block
                if (el.closest('pre') || el.closest('code') || el.tagName === 'PRE' || el.tagName === 'CODE') {
                    el.style.lineHeight = codeLineHeight;
                } else {
                    el.style.lineHeight = descriptionLineHeight;
                }
            });
        }

        // Data-driven detail images logic (multiple images, random tilt)
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.__MENU_DATA) return;
            const urlParams = new URLSearchParams(window.location.search);
            const slugParam = urlParams.get('item');
            let pageData;
            if (slugParam) {
                const findBySlug = (arr, slug) => {
                    for (const entry of arr) {
                        if (entry.url && entry.url.includes(slug)) return entry;
                        if (entry.submenu) {
                            const found = findBySlug(entry.submenu, slug);
                            if (found) return found;
                        }
                    }
                    return null;
                };
                pageData = findBySlug(window.__MENU_DATA, slugParam);
                // Expose images for modal
                window.__DETAIL_IMAGES = pageData && Array.isArray(pageData.detailImages) ? pageData.detailImages : [];
            }
            // Remove old single image
            const oldImg = document.getElementById('project-detail-image');
            if (oldImg) oldImg.remove();
            // Always populate .project-gallery with stacked images
            const gallery = document.querySelector('.project-gallery');
            if (gallery) gallery.innerHTML = '';
            if (pageData && Array.isArray(pageData.detailImages)) {
                window.__DETAIL_IMAGES = pageData.detailImages;
                pageData.detailImages.forEach((src, i) => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = `Project detail image ${i + 1}`;
                    img.className = 'detail-stack-image detail-stack-image-base';
                    img.style.display = 'block';
                    img.style.position = 'absolute';
                    img.style.width = '340px';
                    img.style.borderRadius = '8px';
                    img.style.boxShadow = '0 4px 24px rgba(0,0,0,0.20)';
                    // Make clickable to open modal
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', () => showImageModal(i));
                    // Random tilt between -15 and +15 degrees
                    const tilt = (Math.random() * 30 - 15).toFixed(2) + 'deg';
                    img.style.setProperty('--tilt', tilt);
                    img.dataset.origTilt = parseFloat(tilt);
                    img.style.left = 'calc(50% + 100px)';
                    // Stagger vertical position for up to 4 images
                    if (i === 0) img.style.top = '100px';
                    if (i === 1) img.style.top = '450px';
                    if (i === 2) img.style.top = '800px';
                    if (i === 3) img.style.top = '1150px';
                    gallery.appendChild(img);
                });
            }
            // Only add .mobile-gallery slideshow if on mobile, and insert it inside .project-info after meta-data
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            if (isMobile && pageData && Array.isArray(pageData.detailImages)) {
                // Wait for .project-info to be populated
                setTimeout(() => {
                    const projectInfo = document.querySelector('.project-info');
                    if (!projectInfo) return;
                    // Remove any previous .mobile-gallery
                    const oldMobileGallery = projectInfo.querySelector('.mobile-gallery');
                    if (oldMobileGallery) oldMobileGallery.remove();
                    // Create new .mobile-gallery
                    const mobileGallery = document.createElement('div');
                    mobileGallery.className = 'mobile-gallery';
                    mobileGallery.setAttribute('aria-label', 'Mobile project gallery');
                    // Find the meta-data <ul> (or fallback to first <p.description> or .dynamic-body)
                    let insertAfter = projectInfo.querySelector('ul');
                    if (!insertAfter) {
                        // Try to find the first .description or .dynamic-body
                        insertAfter = projectInfo.querySelector('.description') || projectInfo.querySelector('.dynamic-body');
                        if (insertAfter) insertAfter = insertAfter.previousElementSibling;
                    }
                    // Insert .mobile-gallery after meta-data <ul>
                    if (insertAfter && insertAfter.parentNode === projectInfo) {
                        insertAfter.after(mobileGallery);
                    } else {
                        // Fallback: insert at the top
                        projectInfo.prepend(mobileGallery);
                    }
                    // Build simple slideshow
                    let currentIdx = 0;
                    function renderMobileSlide(idx) {
                        mobileGallery.innerHTML = '';
                        const img = document.createElement('img');
                        img.src = pageData.detailImages[idx];
                        img.alt = `Project detail image ${idx + 1} of ${pageData.detailImages.length}`;
                        img.style.width = '100%';
                        img.style.maxWidth = '420px';
                        img.style.display = 'block';
                        img.style.margin = '0 auto 12px auto';
                        img.style.borderRadius = '8px';
                        img.style.boxShadow = '0 4px 24px rgba(0,0,0,0.20)';
                        // Navigation controls
                        const nav = document.createElement('div');
                        nav.style.display = 'flex';
                        nav.style.justifyContent = 'center';
                        nav.style.alignItems = 'center';
                        nav.style.gap = '18px';
                        nav.style.marginBottom = '8px';
                        const prevBtn = document.createElement('button');
                        prevBtn.textContent = '◀';
                        prevBtn.setAttribute('aria-label', 'Previous image');
                        prevBtn.style.fontSize = '22px';
                        prevBtn.style.background = 'none';
                        prevBtn.style.border = 'none';
                        prevBtn.style.cursor = 'pointer';
                        prevBtn.style.color = '#FF0000';
                        prevBtn.disabled = idx === 0;
                        prevBtn.onclick = () => { if (currentIdx > 0) { currentIdx--; renderMobileSlide(currentIdx); } };
                        const nextBtn = document.createElement('button');
                        nextBtn.textContent = '▶';
                        nextBtn.setAttribute('aria-label', 'Next image');
                        nextBtn.style.fontSize = '22px';
                        nextBtn.style.background = 'none';
                        nextBtn.style.border = 'none';
                        nextBtn.style.cursor = 'pointer';
                        nextBtn.style.color = '#FF0000';
                        nextBtn.disabled = idx === pageData.detailImages.length - 1;
                        nextBtn.onclick = () => { if (currentIdx < pageData.detailImages.length - 1) { currentIdx++; renderMobileSlide(currentIdx); } };
                        nav.appendChild(prevBtn);
                        nav.appendChild(img);
                        nav.appendChild(nextBtn);
                        // Click to expand
                        img.style.cursor = 'pointer';
                        img.addEventListener('click', () => showImageModal(idx));
                        mobileGallery.appendChild(nav);
                        // Optional: show image count
                        const count = document.createElement('div');
                        count.style.textAlign = 'center';
                        count.style.fontSize = '13px';
                        count.style.color = '#888';
                        count.textContent = `${idx + 1} / ${pageData.detailImages.length}`;
                        count.setAttribute('aria-label', `Image ${idx + 1} of ${pageData.detailImages.length}`);
                        mobileGallery.appendChild(count);
                    }
                    renderMobileSlide(currentIdx);
                }, 0);
            }
            
            // Fix line breaks in code blocks after content is loaded
            setTimeout(fixCodeBlockLineBreaks, 100);
            // Apply line height after content is loaded
            setTimeout(applyLineHeightToProjectInfo, 100);
        });

        // Modal helper
        function showImageModal(startIdx) {
            const imagesArr = Array.isArray(window.__DETAIL_IMAGES) ? window.__DETAIL_IMAGES : [];
            if (!imagesArr.length) return;
            let currentIdx = startIdx;
            // Prevent multiple overlays
            if (document.querySelector('.image-modal-overlay')) return;
            const overlay = document.createElement('div');
            overlay.className = 'image-modal-overlay';
            const img = document.createElement('img');
            img.src = imagesArr[currentIdx];
            img.alt = '';
            overlay.appendChild(img);

            // Close X
            const closeX = document.createElement('div');
            closeX.className = 'image-modal-close';
            closeX.textContent = '×';
            closeX.addEventListener('click', e => { e.stopPropagation(); overlay.remove(); });
            overlay.appendChild(closeX);

            // Arrow controls
            const leftArrow = document.createElement('div');
            leftArrow.className = 'image-modal-arrow left';
            leftArrow.textContent = '‹';
            const rightArrow = document.createElement('div');
            rightArrow.className = 'image-modal-arrow right';
            rightArrow.textContent = '›';
            overlay.appendChild(leftArrow);
            overlay.appendChild(rightArrow);

            function updateArrows() {
                leftArrow.classList.toggle('disabled', currentIdx === 0);
                rightArrow.classList.toggle('disabled', currentIdx === imagesArr.length - 1);
            }

            leftArrow.addEventListener('click', e => {
                e.stopPropagation();
                if (currentIdx > 0) {
                    currentIdx--; img.src = imagesArr[currentIdx]; updateArrows();
                }
            });
            rightArrow.addEventListener('click', e => {
                e.stopPropagation();
                if (currentIdx < imagesArr.length - 1) {
                    currentIdx++; img.src = imagesArr[currentIdx]; updateArrows();
                }
            });

            updateArrows();

            // Keyboard navigation
            function handleKey(e) {
                if (e.key === 'ArrowLeft') {
                    leftArrow.click();
                } else if (e.key === 'ArrowRight') {
                    rightArrow.click();
                } else if (e.key === 'Escape') {
                    closeModal();
                }
            }

            document.addEventListener('keydown', handleKey);

            function closeModal() {
                document.removeEventListener('keydown', handleKey);
                overlay.remove();
            }

            // Replace previous listeners to use closeModal
            overlay.addEventListener('click', closeModal);
            closeX.removeEventListener('click', () => { }); // ensure no duplicate
            closeX.addEventListener('click', e => { e.stopPropagation(); closeModal(); });
            document.body.appendChild(overlay);
            // trigger animated entrance
            requestAnimationFrame(() => {
                overlay.classList.add('active');
            });
        }
    </script>
</body>
</html>
