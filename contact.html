<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Knectar</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="apple-touch-icon" href="assets/logo.svg">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Cookie Consent Manager -->
    <link rel="stylesheet" id="silktide-consent-manager-css" href="cookies-banner/silktide-consent-manager.css">
    <script src="cookies-banner/silktide-consent-manager.js"></script>
    <script>
    silktideCookieBannerManager.updateCookieBannerConfig({
      background: {
        showBackground: true
      },
      cookieIcon: {
        position: "bottomRight"
      },
      cookieTypes: [
        {
          id: "necessary",
          name: "Necessary",
          description: "<p>These cookies are necessary for the website to function properly and cannot be switched off. They help with things like logging in and setting your privacy preferences.</p>",
          required: true,
          onAccept: function() {
            console.log('Add logic for the required Necessary here');
          }
        },
        {
          id: "analytics",
          name: "Analytical",
          description: "<p>These cookies help us improve the site by tracking which pages are most popular and how visitors move around the site.</p>",
          defaultValue: true,
          onAccept: function() {
            gtag('consent', 'update', {
              analytics_storage: 'granted',
            });
            dataLayer.push({
              'event': 'consent_accepted_analytics',
            });
          },
          onReject: function() {
            gtag('consent', 'update', {
              analytics_storage: 'denied',
            });
          }
        },
        {
          id: "advertising",
          name: "Advertising",
          description: "<p>These cookies provide extra features and personalization to improve your experience. They may be set by us or by partners whose services we use.</p>",
          onAccept: function() {
            gtag('consent', 'update', {
              ad_storage: 'granted',
              ad_user_data: 'granted',
              ad_personalization: 'granted',
            });
            dataLayer.push({
              'event': 'consent_accepted_advertising',
            });
          },
          onReject: function() {
            gtag('consent', 'update', {
              ad_storage: 'denied',
              ad_user_data: 'denied',
              ad_personalization: 'denied',
            });
          }
        }
      ],
      text: {
        banner: {
          description: "<p>We use cookies on our site to enhance your user experience, provide personalized content, and analyze our traffic. <a href=\"privacy-policy.html\" target=\"_blank\">Cookie Policy.</a></p>",
          acceptAllButtonText: "Accept all",
          acceptAllButtonAccessibleLabel: "Accept all cookies",
          rejectNonEssentialButtonText: "Reject non-essential",
          rejectNonEssentialButtonAccessibleLabel: "Reject non-essential",
          preferencesButtonText: "Preferences",
          preferencesButtonAccessibleLabel: "Toggle preferences"
        },
        preferences: {
          title: "Customize your cookie preferences",
          description: "<p>We respect your right to privacy. You can choose not to allow some types of cookies. Your cookie preferences will apply across our website.</p>",
          creditLinkText: "Get this banner for free",
          creditLinkAccessibleLabel: "Get this banner for free"
        }
      }
    });
    </script>
    
    <script src="js/load_menu.js"></script>
    <script src="js/phone-obfuscation.js" defer></script>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQ8X9HLL"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="container">
        <main class="main-content">
            <header class="page-header">
                <div class="mobile-header-top">
                    <div class="logo logo-mobile">
                        <a href="index.html"><img src="assets/logo.svg" alt="Knectar Logo" class="logo-icon">KNECTAR</a>
                    </div>
                    <button class="hamburger" id="hamburger-button" aria-label="Toggle navigation menu" aria-expanded="false">
                        <span></span><span></span><span></span>
                    </button>
                </div>
                <div class="breadcrumbs">
                    <a href="index.html" class="breadcrumb-link">Home</a> &gt; Contact
                </div>
            </header>
            <h2 style="font-family: var(--font-serif); font-size: 1.475rem; font-weight: 600; color: var(--color-text-primary); line-height: var(--line-height-heading); margin: 50px 0 10px 0;">Connect with us | Kvetch to us | Eat tacos with us</h2>
            <form class="contact-form" action="https://formspree.io/f/mqalqbvg" method="POST" autocomplete="off">
                <input type="hidden" name="_next" value="https://knectar.com/contact_confirmation.html">
                <label for="name">Your name?</label>
                <input type="text" id="name" name="name" required autocomplete="off">
                <label for="email">Your email?</label>
                <input type="email" id="email" name="email" required autocomplete="off">
                <label for="message">Tell us about your project</label>
                <textarea id="message" name="message" required></textarea>
                <!-- Hidden field for spam bots -->
                <input type="text" name="_gotcha" style="display:none">
                <button type="submit">Send</button>
            </form>
            <div class="contact-call-block">
                <h3>Or call</h3>
                <a href="#" class="contact-phone" id="phone-link"><span id="phone-display">Click to reveal</span></a>
            </div>
        </main>
        
        <!-- Interactive Lines Section -->
        <section id="interactive-lines" class="interactive-lines-section">
            <div id="controls">
                <span id="clickPrompt" class="click-prompt">click spacebar to play</span>
                <button id="playPauseBtn" aria-label="Play/Pause animation" aria-pressed="false">
                    <img src="assets/simple_play.svg" alt="Play icon" class="play-icon">
                </button>
            </div>
            <div id="beatControls" role="group" aria-label="Beat controls">
                <div class="beatDot" data-index="0" role="button" tabindex="0" aria-label="Beat 1"></div>
                <div class="beatDot" data-index="1" role="button" tabindex="0" aria-label="Beat 2"></div>
                <div class="beatDot" data-index="2" role="button" tabindex="0" aria-label="Beat 3"></div>
                <div class="beatDot" data-index="3" role="button" tabindex="0" aria-label="Beat 4"></div>
                <div class="beatDot" data-index="4" role="button" tabindex="0" aria-label="Beat 5"></div>
                <div class="beatDot" data-index="5" role="button" tabindex="0" aria-label="Beat 6"></div>
                <div class="beatDot" data-index="6" role="button" tabindex="0" aria-label="Beat 7"></div>
                <div class="beatDot" data-index="7" role="button" tabindex="0" aria-label="Beat 8"></div>
            </div>
            <canvas id="patternCanvas" role="img" aria-label="Interactive lines animation"></canvas>
        </section>
    </div>
    
    <!-- Lines animation script -->
    <script src="js/lines.js"></script>
    <!-- Footer loaded by footer loader -->
    <script src="js/load_footer.js"></script>
</body>
</html>
