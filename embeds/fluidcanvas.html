<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas fluid simulation after Jonas Wagner</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #087a82;
            font-family: Georgia, 'Times New Roman', serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }
        .credit {
            position: absolute;
            left: 8px;
            bottom: 6px;
            margin: 0;
            font-size: 11px;
            line-height: 1.3;
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
            pointer-events: auto;
        }
        .credit a {
            color: inherit;
            text-decoration: underline;
        }
        body.tile .credit { display: none; }
    </style>
</head>
<body>
    <canvas id="fluid" width="512" height="512" aria-label="Interactive Navier–Stokes dye simulation. Drag to stir."></canvas>
    <p class="credit">
        After <a href="https://29a.ch/sandbox/2012/fluidcanvas/" target="_blank" rel="noopener">Jonas Wagner</a>, 2012
    </p>
    <script src="/js/fluidcanvas.js?v=20260910h"></script>
    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const isTile = params.get('tile') === '1';
            if (isTile) document.body.classList.add('tile');
            if (window.KnectarFluid) {
                window.KnectarFluid.mount(document.getElementById('fluid'), {
                    tile: isTile,
                    interactive: true
                });
            }
        })();
    </script>
</body>
</html>
