<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quill Editor Demo with Live Render</title>

  <!-- Quill Snow Theme -->
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">

  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { margin-bottom: 20px; }
    #editor {
      height: 300px;
      border: 1px solid #ccc;
    }
    #output {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      min-height: 100px;
      background: #f9f9f9;
    }
  </style>
</head>
<body>

  <h1>Quill Editor Demo with Live Render</h1>

  <!-- Editor -->
  <div id="editor"></div>

  <!-- Rendered Output -->
  <h2>Rendered Output</h2>
  <div id="output"></div>

  <!-- Quill Core -->
  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script>
    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline'],
          ['link', 'image'],
          [{ list: 'ordered' }, { list: 'bullet' }]
        ]
      },
      placeholder: 'Compose an epic...'
    });

    // Update rendered output on text change
    quill.on('text-change', () => {
      document.getElementById('output').innerHTML = quill.root.innerHTML;
    });

    // Initialize with empty render
    document.getElementById('output').innerHTML = quill.root.innerHTML;
  </script>
</body>
</html>
