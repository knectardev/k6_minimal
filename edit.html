<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mode - Knectar Portfolio | Admin Access</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Admin access for Knectar portfolio content management. Secure login for editing portfolio content and menu structure.">
    <meta name="keywords" content="admin, edit, content management, knectar, portfolio">
    <meta name="author" content="Knectar">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://knectar.com/edit.html">
    <meta property="og:title" content="Edit Mode - Knectar Portfolio | Admin Access">
    <meta property="og:description" content="Admin access for Knectar portfolio content management.">
    <meta property="og:image" content="https://knectar.com/assets/logo.svg">
    <meta property="og:site_name" content="Knectar">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://knectar.com/edit.html">
    <meta property="twitter:title" content="Edit Mode - Knectar Portfolio | Admin Access">
    <meta property="twitter:description" content="Admin access for Knectar portfolio content management.">
    <meta property="twitter:image" content="https://knectar.com/assets/logo.svg">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://knectar.com/edit.html">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="apple-touch-icon" href="assets/logo.svg">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Shared menu loader -->
    <script src="js/load_menu.js" defer></script>
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-form h1 {
            margin-bottom: 30px;
            color: #000;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #FF0000;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #FF0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .login-btn:hover {
            background-color: #cc0000;
        }
        
        .error-message {
            color: #FF0000;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
        
        .success-message {
            color: #28a745;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <h1>Edit Mode Access</h1>
            <form id="loginForm" aria-label="Admin login form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required aria-describedby="username-help">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required aria-describedby="password-help">
                </div>
                <button type="submit" class="login-btn" aria-label="Submit login credentials">Login</button>
                <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>
                <div id="successMessage" class="success-message" role="status" aria-live="polite"></div>
            </form>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
