<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knectar Blog – Notes on Web Development, Drupal & Process</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Notes from Knectar on web development, Drupal, process, and side projects. Short posts on what we learned building sites for higher education, e-commerce, and the arts.">
    <meta name="keywords" content="blog, web development, drupal, process, higher education, knectar">
    <meta name="author" content="Knectar">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.knectar.com/blog/" id="og-url">
    <meta property="og:title" content="Knectar Blog – Notes on Web Development, Drupal & Process">
    <meta property="og:description" content="Notes from Knectar on web development, Drupal, process, and side projects.">
    <meta property="og:image" content="https://www.knectar.com/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:site_name" content="Knectar">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.knectar.com/blog/" id="twitter-url">
    <meta property="twitter:title" content="Knectar Blog – Notes on Web Development, Drupal & Process">
    <meta property="twitter:description" content="Notes from Knectar on web development, Drupal, process, and side projects.">
    <meta property="twitter:image" content="https://www.knectar.com/assets/og-image.png">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.knectar.com/blog/" id="canonical-link">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/logo.ico">
    <link rel="apple-touch-icon" href="/assets/logo.svg">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/css/style.css">
    

    <!-- Shared menu loader -->
    <script src="/js/consent.js"></script>
    <script src="/js/load_menu.js"></script>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQ8X9HLL"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="container">
        <!-- ==== MAIN CONTENT ==== -->
        <main class="main-content">
            <header class="page-header">
                <div class="mobile-header-top">
                    <div class="logo logo-mobile">
                        <a href="/index.html"><img src="/assets/logo.svg" alt="Knectar Logo" class="logo-icon">KNECTAR</a>
                    </div>
                    <button class="hamburger" id="hamburger-button" aria-label="Toggle navigation menu" aria-expanded="false">
                        <span></span><span></span><span></span>
                    </button>
                </div>
                <div class="breadcrumbs">
                    <a href="/index.html" class="breadcrumb-link">Home</a> &gt; <a href="/blog/" class="breadcrumb-link" id="crumbBlog">Blog</a> &gt; <span id="crumbBlogCategory">All</span>
                </div>
            </header>

            <!-- Category filter -->
            <div style="margin-bottom: var(--spacing-xl); max-width: 250px;" class="select-wrapper custom-select" id="blogCategoryDropdown">
                <button type="button" class="select-toggle" id="blogDropdownToggle" aria-label="Select blog category" aria-expanded="false">
                    <span class="select-icon" id="blogDropdownIcon"></span>
                    <span class="select-label" id="blogDropdownLabel">All</span>
                    <span class="select-caret"></span>
                </button>
                <ul class="select-options" id="blogDropdownOptions" role="listbox">
                    <li data-value="All" role="option"><span class="option-icon"></span>All</li>
                    <!-- Options populated dynamically via JS -->
                </ul>
                <!-- Hidden native select for accessibility & JS hooks -->
                <select id="blogCategoryFilter" style="display:none;" aria-label="Blog category filter">
                    <option value="All">All</option>
                    <!-- Options populated dynamically via JS -->
                </select>
            </div>

            <!-- Blog post list -->
            <section class="project-list" id="blogList" aria-label="Blog posts">
                <!-- Tiles populated dynamically from /data/blog.json -->
            </section>

            <!-- Interactive Lines Section (same as home) -->
            <section id="interactive-lines" class="interactive-lines-section">
                <div id="controls">
                    <span id="clickPrompt" class="click-prompt">click spacebar to play</span>
                    <button id="playPauseBtn" aria-label="Play/Pause animation" aria-pressed="false">
                        <img src="/assets/simple_play.svg" alt="Play icon" class="play-icon">
                    </button>
                </div>
                <div id="beatControls" role="group" aria-label="Beat controls">
                    <div class="beatDot" data-index="0" role="button" tabindex="0" aria-label="Beat 1"></div>
                    <div class="beatDot" data-index="1" role="button" tabindex="0" aria-label="Beat 2"></div>
                    <div class="beatDot" data-index="2" role="button" tabindex="0" aria-label="Beat 3"></div>
                    <div class="beatDot" data-index="3" role="button" tabindex="0" aria-label="Beat 4"></div>
                    <div class="beatDot" data-index="4" role="button" tabindex="0" aria-label="Beat 5"></div>
                    <div class="beatDot" data-index="5" role="button" tabindex="0" aria-label="Beat 6"></div>
                    <div class="beatDot" data-index="6" role="button" tabindex="0" aria-label="Beat 7"></div>
                    <div class="beatDot" data-index="7" role="button" tabindex="0" aria-label="Beat 8"></div>
                </div>
                <canvas id="patternCanvas" role="img" aria-label="Interactive lines animation"></canvas>
            </section>
        </main>
    </div>

    <!-- Blog list/detail renderer -->
    <script src="/js/blog.js"></script>
    <script src="/js/lines.js"></script>
    <!-- Image Loading Enhancements -->
    <script src="/js/image-loader.js"></script>
    <!-- Footer loaded by footer loader -->
    <script src="/js/load_footer.js"></script>
</body>
</html>
